services:
  # PostgreSQL databases
  postgres-events:
    image: postgres:15-alpine
    container_name: tickon-postgres-events
    environment:
      POSTGRES_DB: tickon_events
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-events-data:/var/lib/postgresql/data
    networks:
      - tickon-network

  postgres-identity:
    image: postgres:15-alpine
    container_name: tickon-postgres-identity
    environment:
      POSTGRES_DB: tickon_identity
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-identity-data:/var/lib/postgresql/data
    networks:
      - tickon-network

  # Eureka Server
  eureka-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
      args:
        SERVICE_PATH: services/eureka-server
    container_name: tickon-eureka
    develop:
      watch:
        - action: rebuild
          path: services/eureka-server
    ports:
      - "8761:8761"
    environment:
      SPRING_DEVTOOLS_RESTART_ENABLED: true
      SERVICE_NAME: eureka-server
    volumes:
      - .:/workspace
      - ./services/eureka-server:/app
      - maven-cache:/root/.m2/repository
    networks:
      - tickon-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
      args:
        SERVICE_PATH: services/api-gateway
    container_name: tickon-gateway
    develop:
      watch:
        - action: rebuild
          path: services/api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_DEVTOOLS_RESTART_ENABLED: true
      SERVICE_NAME: api-gateway
      SECURITY_JWT_PUBLIC_KEY: ${SECURITY_JWT_PUBLIC_KEY:-}
    volumes:
      - .:/workspace
      - ./services/api-gateway:/app
      - maven-cache:/root/.m2/repository
    depends_on:
      - eureka-server
    networks:
      - tickon-network

  # Event Service
  event-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
      args:
        SERVICE_PATH: services/event-service
    container_name: tickon-event-service
    develop:
      watch:
        - action: rebuild
          path: services/event-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-events:5432/tickon_events
      SPRING_DEVTOOLS_RESTART_ENABLED: true
      SERVICE_NAME: event-service
    volumes:
      - .:/workspace
      - ./services/event-service:/app
      - maven-cache:/root/.m2/repository
    depends_on:
      - postgres-events
      - eureka-server
    networks:
      - tickon-network

  # Identity Service
  identity-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
      args:
        SERVICE_PATH: services/identity-service
    container_name: tickon-identity-service
    develop:
      watch:
        - action: rebuild
          path: services/identity-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-identity:5432/tickon_identity
      SPRING_DEVTOOLS_RESTART_ENABLED: true
      SERVICE_NAME: identity-service
      SECURITY_JWT_PRIVATE_KEY: ${SECURITY_JWT_PRIVATE_KEY:-}
      SECURITY_JWT_PUBLIC_KEY: ${SECURITY_JWT_PUBLIC_KEY:-}
      REFRESH_TOKEN_PEPPER: ${REFRESH_TOKEN_PEPPER:-}
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
    volumes:
      - .:/workspace
      - ./services/identity-service:/app
      - maven-cache:/root/.m2/repository
    depends_on:
      - postgres-identity
      - eureka-server
    networks:
      - tickon-network

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: tickon-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./infra/prometheus/rules:/etc/prometheus/rules
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    networks:
      - tickon-network

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: tickon-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - tickon-network

  # Grafana Tempo — Distributed Trace Backend
  tempo:
    image: grafana/tempo:latest
    container_name: tickon-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infra/tempo/tempo.yaml:/etc/tempo.yaml
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"
      - "4318:4318"
    networks:
      - tickon-network

  # Grafana Loki — Log Aggregation Backend
  loki:
    image: grafana/loki:latest
    container_name: tickon-loki
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./infra/loki/loki.yaml:/etc/loki/loki.yaml
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      - tickon-network

  # Promtail — Log Shipper (Docker socket discovery)
  promtail:
    image: grafana/promtail:latest
    container_name: tickon-promtail
    command: ["-config.file=/etc/promtail/promtail.yaml"]
    volumes:
      - ./infra/promtail/promtail.yaml:/etc/promtail/promtail.yaml
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    networks:
      - tickon-network

volumes:
  postgres-events-data:
  postgres-identity-data:
  prometheus-data:
  grafana-data:
  tempo-data:
  loki-data:
  maven-cache:

networks:
  tickon-network:
    driver: bridge
