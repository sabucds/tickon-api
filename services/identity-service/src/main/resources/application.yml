spring:
  application:
    name: identity-service
  datasource:
    url: jdbc:postgresql://localhost:5432/tickon_identity
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8082

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka-server:8761/eureka
  instance:
    hostname: identity-service
    prefer-ip-address: false
    instance-id: ${spring.application.name}:${random.value}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

security:
  jwt:
    private-key: "${SECURITY_JWT_PRIVATE_KEY:}"
    public-key: "${SECURITY_JWT_PUBLIC_KEY:}"
    access-token-expiration: 900000 # 15 minutes
    session-expiration: 1209600000 # 14 days
    issuer: tickon-identity
    refresh-token-pepper: "${REFRESH_TOKEN_PEPPER:}"
